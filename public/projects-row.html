<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selected projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1A1A;
  --grey:#8A8A8A;
  --line:#111111;
  --h:clamp(76px,8.1vw,122px);   /* thumbnail height — every tile matches */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#FFFFFF;color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
img{display:block}

.stage{
  position:relative;width:100%;max-width:1540px;
  padding:0 clamp(38px,6.2vw,120px);
}

/* ---------- arrows ---------- */
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:clamp(60px,9vw,150px);height:22px;
  background:none;border:0;padding:0;cursor:pointer;
  display:flex;align-items:center;
}
.arrow svg{width:100%;height:22px;overflow:visible}
.arrow line,.arrow path{stroke:var(--line);stroke-width:.8;fill:none;
  transition:opacity .3s ease}
.arrow:hover line,.arrow:hover path{opacity:.45}
.arrow.prev{left:0}
.arrow.next{right:0}
.arrow:disabled{opacity:.22;cursor:default}
.arrow:focus-visible{outline:1px solid var(--ink);outline-offset:6px}

/* ---------- row ---------- */
.row{
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(16px,2.3vw,52px);
  flex-wrap:nowrap;
  overflow-x:auto;scroll-behavior:smooth;
  scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:4px;
}
.row::-webkit-scrollbar{display:none}

.item{flex:0 0 auto;text-align:center;text-decoration:none;color:inherit}

.item figure{
  margin:0;height:var(--h);display:flex;align-items:flex-end;justify-content:center;
}
.item img{
  height:var(--h);width:auto;
  filter:grayscale(.55) contrast(.9) brightness(1.07);
  transition:filter .55s ease;
}
.item:hover img{filter:grayscale(0) contrast(1) brightness(1)}

.no{
  font-size:clamp(19px,1.7vw,26px);font-weight:400;letter-spacing:.02em;
  margin-top:clamp(20px,2.2vw,34px);line-height:1;
}
.nm{
  font-style:italic;font-weight:600;font-size:clamp(13px,1.1vw,17px);line-height:1.25;
  margin-top:clamp(16px,1.7vw,26px);
  min-height:2.5em;                /* two lines, so every meta line starts level */
}
.mt{
  font-style:italic;font-weight:400;font-size:clamp(10px,.82vw,12px);line-height:1.35;
  color:var(--grey);margin-top:clamp(9px,1vw,14px);
}

@media (max-width:820px){
  :root{--h:96px}
  .stage{padding:0 56px}
  .row{justify-content:flex-start}
  .nm{font-size:14px}
  .mt{font-size:10.5px}
}
@media (max-width:560px){
  :root{--h:88px}
  .stage{padding:0 38px}
  .arrow{width:30px}
  .row{gap:18px}
}
@media (prefers-reduced-motion:reduce){
  .row{scroll-behavior:auto}
  .item img{transition:none}
}
</style>
</head>

<script>
(function(){
  var row = document.getElementById('row'),
      prev = document.getElementById('prev'),
      next = document.getElementById('next');

  function step(){ return Math.max(220, row.clientWidth * 0.55); }
  prev.addEventListener('click', function(){ row.scrollBy({left:-step()}); });
  next.addEventListener('click', function(){ row.scrollBy({left: step()}); });

  function sync(){

    prev.disabled = row.scrollLeft <= 2;
    next.disabled = row.scrollLeft >= max;

  addEventListener('resize', sync);
  sync();
})();

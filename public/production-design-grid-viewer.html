<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Design — Image Grid</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  .grid {
    width: 100%;
    max-width: none; height: 400px;
    margin: 0 auto;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: 400px;
    gap: 0;
    align-items: center;
  }

  .grid-item {
    position: relative;
    appearance: none;
    border: 0;
    padding: 0;
    margin: 0;
    width: 100%;
    aspect-ratio: auto;
    height: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fff;
    cursor: zoom-in;
  }

  .grid-item .grid-background {
    display: none;
  }

  .grid-item .grid-foreground {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    background: #fff;
    transition: transform 220ms ease;
  }

  .grid-item:hover .grid-foreground {
    transform: scale(1.015);
  }

  .viewer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: #fff;
    padding: 0;
  }

  .viewer.is-open {
    display: flex;
  }

  .viewer-image {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
  }

  .viewer-button {
    position: absolute;
    z-index: 2;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #121212;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 24px;
    line-height: 1;
  }

  .viewer-button:hover {
    background: #fff;
  }

  .viewer-close {
    top: 20px;
    right: 22px;
  }

  .viewer-prev {
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
  }

  .viewer-next {
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
  }

  .viewer-counter {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: #121212;
    font-size: 13px;
    letter-spacing: .12em;
  }

  @media (max-width: 900px) {
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto;
      height: auto;
      padding: 0;
      gap: 0;
    }

    .grid-item { aspect-ratio: 1 / 1; height: auto; }

    .viewer {
      padding: 0;
    }
  }

  @media (max-width: 600px) {
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      height: auto;
    }

    .viewer {
      padding: 0;
    }

    .viewer-image {
      max-width: 100vw;
      max-height: 100vh;
    }

    .viewer-prev {
      left: 10px;
    }

    .viewer-next {
      right: 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .grid-item .grid-foreground {
      transition: none;
    }
  }
</style>
</head>
<body>

<main class="grid" aria-label="Production Design image grid">
  <button class="grid-item" type="button" data-index="0" aria-label="Open image 1"><img class="grid-background" src="production-images/Slide1.JPG" alt="" aria-hidden="true" loading="lazy"><img class="grid-foreground" src="production-images/Slide1.JPG" alt="Production Design image 1" loading="lazy">
</button><button class="grid-item" type="button" data-index="1" aria-label="Open image 2"><img class="grid-background" src="production-images/Slide4.JPG" alt="" aria-hidden="true" loading="lazy"><img class="grid-foreground" src="production-images/Slide4.JPG" alt="Production Design image 2" loading="lazy">
</button><button class="grid-item" type="button" data-index="2" aria-label="Open image 3"><img class="grid-background" src="production-images/Slide5.JPG" alt="" aria-hidden="true" loading="lazy"><img class="grid-foreground" src="production-images/Slide5.JPG" alt="Production Design image 3" loading="lazy">
</button><button class="grid-item" type="button" data-index="3" aria-label="Open image 4"><img class="grid-background" src="production-images/Slide6.JPG" alt="" aria-hidden="true" loading="lazy"><img class="grid-foreground" src="production-images/Slide6.JPG" alt="Production Design image 4" loading="lazy">
</button>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="viewer-button viewer-close" id="closeButton" type="button" aria-label="Close viewer">×</button>
  <button class="viewer-button viewer-prev" id="prevButton" type="button" aria-label="Previous image">‹</button>
  <img class="viewer-image" id="viewerImage" alt="">
  <button class="viewer-button viewer-next" id="nextButton" type="button" aria-label="Next image">›</button>
  <div class="viewer-counter" id="counter">1 / 4</div>
</div>

<script>
(() => {
  const items = Array.from(document.querySelectorAll('.grid-item'));
  const viewer = document.getElementById('viewer');
  const viewerImage = document.getElementById('viewerImage');
  const counter = document.getElementById('counter');
  const closeButton = document.getElementById('closeButton');
  const prevButton = document.getElementById('prevButton');
  const nextButton = document.getElementById('nextButton');

  let currentIndex = 0;

  function openViewer(index) {
    currentIndex = (index + items.length) % items.length;
    const image = items[currentIndex].querySelector('.grid-foreground');

    viewerImage.src = image.src;
    viewerImage.alt = image.alt;
    counter.textContent = `${currentIndex + 1} / ${items.length}`;

    viewer.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    closeButton.focus();
  }

  function closeViewer() {
    viewer.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  function showPrevious() {
    openViewer(currentIndex - 1);
  }

  function showNext() {
    openViewer(currentIndex + 1);
  }

  items.forEach((item, index) => {
    item.addEventListener('click', () => openViewer(index));
  });

  closeButton.addEventListener('click', closeViewer);
  prevButton.addEventListener('click', showPrevious);
  nextButton.addEventListener('click', showNext);

  viewer.addEventListener('click', (event) => {
    if (event.target === viewer) closeViewer();
  });

  document.addEventListener('keydown', (event) => {
    if (!viewer.classList.contains('is-open')) return;

    if (event.key === 'Escape') closeViewer();
    if (event.key === 'ArrowLeft') showPrevious();
    if (event.key === 'ArrowRight') showNext();
  });
})();
</script>

</body>
</html>

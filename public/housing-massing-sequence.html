<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Massing sequences</title>
<style>
:root{
  --bg-primary:#fff; --text-primary:#1A1A1A; --text-secondary:#8A8A8A;
  --border-subtle:#E4E4E2; --slot:#B5342B; --plate:#fff;
}
[data-theme="dark"]{
  --bg-primary:#0C0C0C; --text-primary:#EDEBE6; --text-secondary:#87837B;
  --border-subtle:#242423; --slot:#E0776C; --plate:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);
  font-family:"PWC-Medium",Arial,Helvetica,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .4s,color .4s}
img{display:block;width:100%;height:auto;max-width:none}
h1,h2,p,figure{margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.seq{max-width:700px;margin:0 auto;padding:clamp(40px,7vh,90px) clamp(18px,4vw,48px)}
.seq + .seq{border-top:1px solid var(--border-subtle)}
.seq__head{text-align:center;margin-bottom:clamp(20px,2.6vw,34px)}
.seq__head h2{font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.seq__head p{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-secondary);margin-top:6px}

.stage{position:relative;background:var(--plate);overflow:hidden;user-select:none}
.stage figure{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.stage figure.on{opacity:1}
.stage figure img{height:100%;object-fit:cover}
.stage figure.on img{animation:drift 5s ease-out forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.016)}}

.half{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.half.prev{left:0} .half.next{right:0}
@media (hover:hover){ .half{cursor:none} }

.cursor{position:fixed;z-index:60;pointer-events:none;opacity:0;
  transform:translate(-50%,-50%) scale(.7);transition:opacity .22s,transform .22s}
.cursor svg{width:40px;height:40px;stroke:var(--text-primary);fill:none;stroke-width:1.2}
.cursor.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor.flip svg{transform:scaleX(-1)}
@media (hover:none){.cursor{display:none}}

.caption{min-height:74px;text-align:center;margin-top:clamp(18px,2.4vw,30px);
  padding-inline:clamp(0px,6vw,110px)}
.caption p{font-size:13.5px;line-height:1.55;transition:opacity .3s ease}
.caption .key{font-weight:500}
.caption .slot{color:var(--slot)}
.counter{text-align:center;margin-top:20px;font-size:13px;letter-spacing:.06em}
.counter .now{color:var(--text-secondary)}
.track{display:flex;gap:4px;justify-content:center;margin-top:14px}
.track button{width:30px;height:2px;background:var(--border-subtle);transition:background .3s}
.track button[aria-current="true"]{background:var(--text-primary)}
.hint{text-align:center;margin-top:16px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-secondary)}

@media (prefers-reduced-motion:reduce){
  .stage figure{transition:none} .stage figure.on img{animation:none}
}

.bar button{border:1px solid var(--border-subtle);padding:7px 11px;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary);background:var(--bg-primary)}

/* Portfolio type system: headings use PWC-Bold; supporting copy uses PWC-Medium. */
h1,h2,h3,h4,h5,h6,.title,.ttl,.h1,.h2,.seq-title,.band__head h2,.panel__label h3,.study__head h1,.seq__head h2,.mlist h2,.feature .side h3 { font-family:"PWC-Bold",Arial,Helvetica,sans-serif; font-weight:700; }
body { font-family:"PWC-Medium",Arial,Helvetica,sans-serif; }
</style>
</head>

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cur = document.getElementById('cursor');
const pad = n => String(n).padStart(2,'0');

SEQUENCES.forEach(seq => {
  const sec = document.createElement('section');
  sec.className = 'seq';
  sec.innerHTML = `
    <div class="seq__head"><h2>${seq.title}</h2><p>${seq.sub}</p></div>
    <div class="stage" style="aspect-ratio:${seq.ratio}" role="group" aria-label="${seq.title} steps">
      <button class="half prev" aria-label="Previous step"></button>
      <button class="half next" aria-label="Next step"></button>
    </div>
    <div class="caption" aria-live="polite"></div>
    <p class="counter"><span class="now">01</span> / <span class="tot">${pad(seq.steps.length)}</span></p>
    <div class="track"></div>
`;
  document.getElementById('main').appendChild(sec);

  const stage=sec.querySelector('.stage'), cap=sec.querySelector('.caption'),
        now=sec.querySelector('.now'), track=sec.querySelector('.track');

  seq.steps.forEach((s,i)=>{
    const f=document.createElement('figure');
    f.innerHTML=`<img src="${s.img}" alt="${seq.title} step ${i+1}: ${s.key}" ${i?'loading="lazy"':''}>`;
    stage.appendChild(f); s.el=f;
    const b=document.createElement('button');
    b.setAttribute('aria-label',`Step ${i+1}`);
    b.onclick=()=>go(i,true); track.appendChild(b); s.dot=b;
  });

  let at=-1, timer=null, paused=false;
  const DWELL=4400;

  function go(i,manual){
    i=(i+seq.steps.length)%seq.steps.length;
    if(i===at) return;
    seq.steps.forEach((s,k)=>{
      s.el.classList.toggle('on',k===i);
      s.dot.setAttribute('aria-current',String(k===i));
      if(k===i && !REDUCED){
        const img=s.el.querySelector('img');
        img.style.animation='none'; void img.offsetWidth; img.style.animation='';
      }
    });
    const s=seq.steps[i];
    cap.style.opacity=0;
    setTimeout(()=>{
      cap.innerHTML=`<p><span class="key">${s.key}</span> &mdash; <span class="${s.slot?'slot':''}">${s.text}</span></p>`;
      cap.style.opacity=1;
    }, at===-1?0:160);
    now.textContent=pad(i+1);
    at=i;
    if(manual) restart();
  }
  function restart(){ clearInterval(timer); if(!paused && !REDUCED) timer=setInterval(()=>go(at+1), DWELL); }

  sec.querySelector('.next').onclick=()=>go(at+1,true);
  sec.querySelector('.prev').onclick=()=>go(at-1,true);
  stage.addEventListener('pointerenter',()=>{paused=true; clearInterval(timer);});
  stage.addEventListener('pointerleave',()=>{paused=false; cur.classList.remove('on'); restart();});
  if(matchMedia('(hover:hover)').matches){
    stage.addEventListener('pointermove',e=>{
      cur.classList.add('on');
      cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
      const r=stage.getBoundingClientRect();
      cur.classList.toggle('flip', e.clientX < r.left + r.width/2);
    });
  }
  stage.tabIndex=0;
  stage.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){e.preventDefault(); go(at+1,true);}
    if(e.key==='ArrowLeft'){e.preventDefault(); go(at-1,true);}
  });
  /* each sequence runs on its own, and only once it is on screen */
  new IntersectionObserver((es,o)=>{ if(es[0].isIntersecting){ go(0); restart(); o.disconnect(); }},
    {threshold:.25}).observe(stage);
  go(0);
});

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — Neighbourhood Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#fff; --text-primary:#1A1A1A; --text-secondary:#8A8A8A;
  --border-subtle:#E4E4E2; --slot:#B5342B; --plate:#fff;
  --g:clamp(12px,1.5vw,24px); --ar:1.1268;      /* --ar = the drawings' own ratio */
}
[data-theme="dark"]{
  --bg-primary:#0C0C0C; --text-primary:#EDEBE6; --text-secondary:#87837B;
  --border-subtle:#242423; --slot:#E0776C; --plate:#fff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg-primary);color:var(--text-primary);
  font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .4s,color .4s}
img{display:block;max-width:none}
h1,h2,h3,p{margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.head{padding:clamp(16px,2.6vh,30px) var(--g) 0;text-align:center}
.head h1{font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.head p{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
        color:var(--text-secondary);margin-top:5px}

/* ---------------- three sequences, side by side ---------------- */
.row{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:var(--g);
  align-items:start;justify-content:center;
  flex:1;align-content:center;        /* share the leftover height evenly, top and bottom */
  padding:clamp(14px,2.4vh,30px) var(--g) var(--g);
  margin:0 auto;
  /* keep the whole row — stages, captions, counters — inside one screen */
  max-width:min(100%, calc((100svh - 250px) * var(--ar) * 3 + 2 * var(--g)));
}
.seq{min-width:0;display:flex;flex-direction:column}
.seq h3{font-size:10px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;
        padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--border-subtle)}

.stage{position:relative;background:var(--plate);overflow:hidden;user-select:none;
       aspect-ratio:1200/1065}
.stage figure{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .55s ease}
.stage figure.on{opacity:1}
.stage figure img{width:100%;height:100%;object-fit:contain;object-position:center}
/* the two drawings in a pair are the same frame, so they cross-fade in place */

.half{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.half.prev{left:0} .half.next{right:0}
@media (hover:hover){ .half{cursor:none} }

.cursor{position:fixed;z-index:60;pointer-events:none;opacity:0;
  transform:translate(-50%,-50%) scale(.7);transition:opacity .22s,transform .22s}
.cursor svg{width:38px;height:38px;stroke:var(--text-primary);fill:none;stroke-width:1.2}
.cursor.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor.flip svg{transform:scaleX(-1)}
@media (hover:none){.cursor{display:none}}

.cap{min-height:clamp(74px,9vh,104px);margin-top:14px}
.cap p{font-size:12px;line-height:1.5;transition:opacity .3s ease}
.cap .key{font-weight:500}
.foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.track{display:flex;gap:3px}
.track button{width:26px;height:2px;background:var(--border-subtle);transition:background .3s}
.track button[aria-current="true"]{background:var(--text-primary)}
.counter{font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);
         font-variant-numeric:tabular-nums;margin-left:auto}
.counter b{color:var(--text-primary);font-weight:500}

.hint{text-align:center;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--text-secondary);padding-bottom:clamp(8px,1.4vh,16px)}

@media (max-width:900px){
  body{overflow:auto}
  .row{grid-template-columns:1fr;max-width:560px}
  .cap{min-height:0}
}
@media (prefers-reduced-motion:reduce){ .stage figure{transition:none} }
</style>
</head>

/4n9f8A4n9f/if1/wDif1/+J/X/AOJ/X/4n9f8A4n9f/if1/wDif1/+J/X/AOJ/X/4n9f8A4n9f/if1/wDif1f+J/V/4n9X/iBaP+/U/q/8f/4v/9k=", "key": "ACTIVITY NODES", "text": "Density is drawn towards three nodes, each one an anchor where routes converge and activity can concentrate."}]}];

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cur = document.getElementById('cursor');
const pad = n => String(n).padStart(2,'0');

SEQUENCES.forEach((seq, si) => {
  const sec = document.createElement('section');
  sec.className = 'seq';
  sec.innerHTML =
    '<h3>' + seq.title + '</h3>' +
    '<div class="stage" role="group" aria-label="' + seq.title + '">' +
      '<button class="half prev" aria-label="Previous"></button>' +
      '<button class="half next" aria-label="Next"></button>' +
    '</div>' +
    '<div class="cap" aria-live="polite"></div>' +
    '<div class="foot"><div class="track"></div>' +
      '<p class="counter"><b class="now">01</b> / ' + pad(seq.steps.length) + '</p></div>';
  document.getElementById('row').appendChild(sec);

  const stage = sec.querySelector('.stage'), cap = sec.querySelector('.cap'),
        now = sec.querySelector('.now'), track = sec.querySelector('.track');

  seq.steps.forEach((s,i)=>{
    const f = document.createElement('figure');
    f.innerHTML = '<img src="'+s.img+'" alt="'+seq.title+': '+s.key+'"'+(i?' loading="lazy"':'')+'>';
    stage.appendChild(f); s.el = f;
    const b = document.createElement('button');
    b.setAttribute('aria-label','Step '+(i+1));
    b.onclick = ()=> go(i,true);
    track.appendChild(b); s.dot = b;
  });

  let at = -1, timer = null, paused = false;
  const DWELL = 4200;

  function go(i, manual){
    i = (i + seq.steps.length) % seq.steps.length;
    if (i === at) return;
    seq.steps.forEach((s,k)=>{
      s.el.classList.toggle('on', k === i);
      s.dot.setAttribute('aria-current', String(k === i));
    });
    const s = seq.steps[i];
    cap.style.opacity = 0;
    setTimeout(()=>{
      cap.innerHTML = '<p><span class="key">'+s.key+'</span> &mdash; '+s.text+'</p>';
      cap.style.opacity = 1;
    }, at === -1 ? 0 : 160);
    now.textContent = pad(i+1);
    at = i;
    if (manual) restart();
  }
  function restart(){
    clearInterval(timer);
    if (!paused && !REDUCED) timer = setInterval(()=> go(at+1), DWELL);
  }

  sec.querySelector('.next').onclick = ()=> go(at+1, true);
  sec.querySelector('.prev').onclick = ()=> go(at-1, true);
  stage.addEventListener('pointerenter', ()=>{ paused = true; clearInterval(timer); });
  stage.addEventListener('pointerleave', ()=>{ paused = false; cur.classList.remove('on'); restart(); });
  if (matchMedia('(hover:hover)').matches){
    stage.addEventListener('pointermove', e=>{
      cur.classList.add('on');
      cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
      const r = stage.getBoundingClientRect();
      cur.classList.toggle('flip', e.clientX < r.left + r.width/2);
    });
  }
  stage.tabIndex = 0;
  stage.addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(at+1, true); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); go(at-1, true); }
  });

  go(0);
  /* stagger the three so they don't all flip on the same beat */
  new IntersectionObserver((es,o)=>{
    if (es[0].isIntersecting){ setTimeout(restart, si * 900); o.disconnect(); }
  }, {threshold:.2}).observe(stage);
});

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site study — step sequence</title>
<style>
:root{
  --bg-primary:#fff; --text-primary:#1A1A1A; --text-secondary:#8A8A8A;
  --border-subtle:#E4E4E2; --slot:#B5342B; --plate:#fff;
}
[data-theme="dark"]{
  --bg-primary:#0C0C0C; --text-primary:#EDEBE6; --text-secondary:#87837B;
  --border-subtle:#242423; --slot:#E0776C; --plate:#fff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);
  font-family:"PWC-Medium",Arial,Helvetica,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease}
img{display:block;width:100%;height:auto}
h1,h2,p,figure{margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.study{max-width:700px;margin:0 auto;padding:clamp(40px,7vh,90px) clamp(18px,4vw,48px)}
.study__head{text-align:center;margin-bottom:clamp(24px,3vw,40px)}
.study__head h1{font-family:"PWC-Bold",Arial,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.study__head p{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-secondary);margin-top:6px}

/* the drawings sit on a white plate — the source images have white backgrounds,
   so in dark mode the plate keeps them readable instead of glowing */
.stage{position:relative;background:var(--plate);aspect-ratio:1358/933;
  overflow:hidden;cursor:pointer;user-select:none}
.stage figure{position:absolute;inset:0;opacity:0;
  transition:opacity .55s ease, transform 4.6s linear}
.stage figure.on{opacity:1}
.stage figure img{height:100%;object-fit:cover}
/* a very slow drift so a held step is never completely static */
.stage figure.on img{animation:drift 5s ease-out forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.018)}}

/* invisible halves: left goes back, right goes forward */
.half{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.half.prev{left:0} .half.next{right:0}
@media (hover:hover){
  .half{cursor:none}
  .cursor{position:fixed;z-index:60;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%) scale(.7);transition:opacity .22s,transform .22s}
  .cursor svg{width:40px;height:40px;stroke:var(--text-primary);fill:none;stroke-width:1.2}
  .cursor.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .cursor.flip svg{transform:scaleX(-1)}
}
@media (hover:none){.cursor{display:none}}

.caption{min-height:78px;text-align:center;margin-top:clamp(20px,2.6vw,34px);
  padding-inline:clamp(0px,6vw,110px)}
.caption p{font-size:13.5px;line-height:1.55;transition:opacity .35s ease}
.caption .key{font-weight:500;letter-spacing:.01em}
.caption .slot{color:var(--slot)}

.counter{text-align:center;margin-top:22px;font-size:13px;letter-spacing:.06em}
.counter .now{color:var(--text-secondary)}
.track{display:flex;gap:4px;justify-content:center;margin-top:16px}
.track button{width:34px;height:2px;background:var(--border-subtle);transition:background .3s}
.track button[aria-current="true"]{background:var(--text-primary)}

.hint{text-align:center;margin-top:18px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-secondary)}

@media (prefers-reduced-motion:reduce){
  .stage figure{transition:none}
  .stage figure.on img{animation:none}
}
@media (max-width:620px){
  .caption{padding-inline:0}
  .caption p{font-size:13px}
}


.bar button{border:1px solid var(--border-subtle);padding:7px 11px;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary);background:var(--bg-primary)}

/* Portfolio type system: headings use PWC-Bold; supporting copy uses PWC-Medium. */
h1,h2,h3,h4,h5,h6,.title,.ttl,.h1,.h2,.seq-title,.band__head h2,.panel__label h3,.study__head h1,.seq__head h2,.mlist h2,.feature .side h3 { font-family:"PWC-Bold",Arial,Helvetica,sans-serif; font-weight:700; }
body { font-family:"PWC-Medium",Arial,Helvetica,sans-serif; }
</style>
</head>
<body>

<div class="cursor" id="cursor" aria-hidden="true">
  <svg viewBox="0 0 40 40"><path d="M13 8 L28 20 L13 32 Z"/></svg>
</div>

<section class="study">
  <div class="study__head">
    <h1>Site Study</h1>
    <p>Proposed mixed-use development &middot; Arbutus Greenway, Vancouver</p>
  </div>

  <div class="stage" id="stage" role="group" aria-label="Site study steps">
    <button class="half prev" id="prev" aria-label="Previous step"></button>
    <button class="half next" id="next" aria-label="Next step"></button>
  </div>

  <div class="caption" id="caption" aria-live="polite"></div>
  <p class="counter"><span class="now" id="now">01</span> / <span id="total">04</span></p>
  <div class="track" id="track"></div>
</section>

  text:'Old and obsolete structure; parking inadequate, pushing cars onto the road; long double-loaded corridors left dark and without ventilation. The threats are taken as the opportunity to do better.',
  slot:false},
 {img:'/projects/housing-one/site-study-step-05.jpg', key:'15M HEIGHT',
  text:'A 15-metre building-height study.',
  slot:false},
 {img:'/projects/housing-one/site-study-step-06.jpg', key:'8M HEIGHT',
  text:'An 8-metre building-height study.',
  slot:false},
];

const stage=document.getElementById('stage'), cap=document.getElementById('caption'),
      now=document.getElementById('now'), total=document.getElementById('total'),
      track=document.getElementById('track'), cur=document.getElementById('cursor');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad=n=>String(n+1).padStart(2,'0');

STEPS.forEach((s,i)=>{
  const f=document.createElement('figure');
  f.innerHTML=`<img src="${s.img}" alt="Site study, step ${i+1}: ${s.key}" ${i?'loading="lazy"':''}>`;
  stage.appendChild(f); s.el=f;
  const b=document.createElement('button');
  b.setAttribute('aria-label',`Step ${i+1}`);
  b.onclick=()=>go(i,true); track.appendChild(b); s.dot=b;
});
total.textContent=pad(STEPS.length-1);

let at=-1, timer=null, paused=false;
const DWELL=4600;

function go(i, manual){
  i=(i+STEPS.length)%STEPS.length;
  if(i===at) return;
  STEPS.forEach((s,k)=>{
    s.el.classList.toggle('on',k===i);
    s.dot.setAttribute('aria-current', String(k===i));
    if(k===i && !REDUCED){                    // restart the drift on each entry
      const img=s.el.querySelector('img');
      img.style.animation='none'; void img.offsetWidth; img.style.animation='';
    }
  });
  const s=STEPS[i];
  cap.style.opacity=0;
  setTimeout(()=>{
    cap.innerHTML=`<p><span class="key">${s.key}</span> &mdash; <span class="${s.slot?'slot':''}">${s.text}</span></p>`;
    cap.style.opacity=1;
  }, at===-1?0:180);
  now.textContent=pad(i);
  at=i;
  if(manual) restart();
}
function restart(){ clearInterval(timer); if(!paused && !REDUCED) timer=setInterval(()=>go(at+1), DWELL); }

document.getElementById('next').onclick=()=>go(at+1,true);
document.getElementById('prev').onclick=()=>go(at-1,true);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ e.preventDefault(); go(at+1,true); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); go(at-1,true); }
});
stage.addEventListener('pointerenter',()=>{paused=true; clearInterval(timer);});
stage.addEventListener('pointerleave',()=>{paused=false; cur.classList.remove('on'); restart();});

if(matchMedia('(hover:hover)').matches){
  stage.addEventListener('pointermove',e=>{
    cur.classList.add('on');
    cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
    const r=stage.getBoundingClientRect();
    cur.classList.toggle('flip', e.clientX < r.left + r.width/2);
  });
}

/* only start once it is actually on screen */
new IntersectionObserver((es,o)=>{ if(es[0].isIntersecting){ go(0); restart(); o.disconnect(); } },
  {threshold:.25}).observe(stage);
go(0);
